# RidePilot's app container runs with RAILS_ENV=development, which echoes every
# SQL statement -- roughly 65 MB/day. Nothing was rotating this and
# development.log had reached 1.3 GB. It gzips ~34x, so 30 days of history
# costs about 60 MB; retention is cheap here and the history is occasionally
# worth having when a dispatcher reports something days later.
#
# copytruncate is required rather than preferred. The Rails logger opens the
# file once for the life of the Puma process and has no reopen signal, so the
# default rename-and-create would leave it writing to the unlinked inode: the
# rotated file would keep growing invisibly and the new development.log would
# sit empty until someone restarted the container.
#
# Runs as root because the app container runs as root, so these files are
# root-owned and no other user can truncate them.

/home/philz/rptest/ridepilot/log/*.log {
    su root root
    daily
    rotate 30
    maxsize 500M
    missingok
    notifempty
    compress
    copytruncate
}
