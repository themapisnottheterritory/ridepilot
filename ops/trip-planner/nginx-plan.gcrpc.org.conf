# plan.gcrpc.org: the Victoria Transit trip planner (static client + OTP behind it).
# Install: sudo cp nginx-plan.gcrpc.org.conf /etc/nginx/sites-available/plan.gcrpc.org
#          sudo ln -s /etc/nginx/sites-available/plan.gcrpc.org /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          then: sudo certbot --nginx -d plan.gcrpc.org   (after the public DNS A record exists)
server {
    listen 80;
    listen [::]:80;
    server_name plan.gcrpc.org;

    root /home/philz/otp/web;
    index index.html;
    add_header X-Content-Type-Options nosniff;

    # OTP GraphQL and REST, same origin so the client needs no CORS.
    location /otp/ {
        proxy_pass http://127.0.0.1:8081/otp/;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Address lookup: the internal Nominatim on 10.0.0.18, limited to the
    # search endpoint and boxed to the service area so it cannot be used as a
    # general geocoder from the internet.
    location = /geocode {
        limit_req zone=geocode burst=10 nodelay;
        proxy_pass http://10.0.0.18:8088/search?format=jsonv2&limit=6&countrycodes=us&viewbox=-97.6,29.7,-95.9,28.2&bounded=1&addressdetails=1&$args;
        proxy_set_header Host 10.0.0.18;
        proxy_read_timeout 10s;
    }
    location = /reverse {
        limit_req zone=geocode burst=10 nodelay;
        proxy_pass http://10.0.0.18:8088/reverse?format=jsonv2&$args;
        proxy_set_header Host 10.0.0.18;
        proxy_read_timeout 10s;
    }

    # Map tiles from the tile server on 10.0.0.16 (internal), cached here.
    location /tiles/ {
        proxy_pass http://10.0.0.16/tiles/;
        proxy_set_header Host 10.0.0.16;
        proxy_cache tiles;
        proxy_cache_valid 200 7d;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
    }
}
