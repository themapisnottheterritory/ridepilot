# basic system config
RIDEPILOT_HOST:
SYSTEM_ADMIN_EMAIL:    
SYSTEM_ADMIN_PASSWORD: 

# Mail server
SMTP_MAIL_ADDR:                 
SMTP_MAIL_DOMAIN:               
SMTP_MAIL_PASSWORD:             
SMTP_MAIL_PORT:                 
SMTP_MAIL_USER_NAME:            
SYSTEM_SEND_FROM_ADDRESS:   

# Planner (trip distance/ETA). Use OSRM with the self-hosted map stack.
TRIP_PLANNER_TYPE: "OSRM"   # GOOGLE, OTP, or OSRM (self-hosted)
OPEN_TRIP_PLANNER_URL:
GOOGLE_TRIP_PLANNER_URL: "https://maps.googleapis.com/maps/api/distancematrix/json?"
OSRM_URL: "http://osrm:5000"   # OSRM routing backend (docker service); used when TRIP_PLANNER_TYPE=OSRM

# Map display, CAD etc
GOOGLE_API_KEY:               
GOOGLE_ROAD_API_KEY:  # it's same as GOOGLE_API_KEY with new google API policy
GOOGLE_ROAD_POINT_LIMIT: # default 100      
GOOGLE_DIRECTIONS_WAYPOINT_LIMIT: # default 25 