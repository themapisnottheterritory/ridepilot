# What's new in RidePilot: notes for staff, shown at /whats_new (the megaphone
# in the header) and read by Ask RidePilot. Newest first. See WhatsNew.
#
# Add a note in the same commit as any change staff will notice. Write it for
# a dispatcher, not a developer: what changed, where to find it, and what to
# do differently, in one to three short sentences. Use **bold** for on-screen
# names exactly as they appear. Skip changes nobody will notice.
#
#   added:     "YYYY-MM-DD HH:MM" Central, when it went live
#   title:     a few words
#   body:      paragraphs separated by a blank line
#   for:       admins            (optional: provider admins and up only)
#   providers: [1]               (optional: 1 GCRPC, 107 Goliad, 143 Lavaca)
#   apps:      [web, tablet]     (optional, web if left out: which app changed --
#                                 web = RidePilot web, tablet = driver tablet
#                                 (GCRPC Demand Response), fixed = fixed-route tablet
#                                 (GCRPC Fixed Route); shown as badges)

- added: "2026-10-06 09:45"
  title: "New report: Vehicle Summary"
  body: |
    **Reports > Vehicle Summary** shows each bus's revenue and non-revenue hours and miles for a date range: revenue from the first pick-up to the last drop-off, non-revenue for the trips from the garage and back. It uses the odometer readings and the run's start and end on the tablet, so a run counts only once the driver closes it out; runs that aren't closed out are listed with what's missing. Choose Excel, CSV or PDF to download it.
- added: "2026-10-06 17:00"
  title: Fewer "address not recognized" moments
  body: |
    The address box now keeps its suggestions to the town you type (even misspelled, or typed without a comma), so "332 Independence Dr, Port Lavaca" no longer suggests a street in Friendswood. It also reads addresses typed with a business name in front, an apartment number, "803-A", "FM957" or "Private Rd 1032".

    When our own map doesn't have a house at all (common out in the country), type the whole address with the town or zip, and RidePilot looks it up on **Azure Maps**: that suggestion says **(Azure Maps)** and puts the pin on the house.
- added: "2026-10-06 10:00"
  title: The town shows when you pick a saved place
  body: |
    When you type a place on a trip (for example **walmart**), each saved place now shows its name, its street, and its **town** as a badge, so the Cuero Walmart and the Victoria ones are easy to tell apart. Places in the rider's own town (from their mailing address) come first with a green badge; places in other towns follow in amber with about how far they are from the rider's home.
- added: "2026-10-05 19:00"
  title: Name busy places
  for: admins
  body: |
    Trips booked to a typed address (for example **2401 Patterson Drive**) showed only the street, so "my trip to the heart clinic" was hard to find. Admins and editors can now open **Saved places**, then **Name busy places**: the busiest unnamed destinations, with **Suggest** (businesses Azure Maps lists there) and a Google Maps link. Saving a name makes it a saved place and puts the name on every trip already booked there.

    A trip address typed later that is already a saved place shows its name by itself, including on the **Trips** list. Names that are already there are never changed.
- added: "2026-10-05 18:05"
  title: Ask RidePilot labels its map pin
  body: |
    On an **Ask RidePilot** place card, the pin now shows what it is: the place's name, its address, and where the spot came from (our map, or Azure Maps). If you drag the pin, the label says **Moved by you**, and **Add it** saves the spot you chose. A place found by name on Azure Maps now fills in its address too.
- added: "2026-10-05 17:50"
  title: Ask RidePilot finds local businesses by name
  body: |
    When our map doesn't know a place by its name, for example "add Diane's Hair Salon, 2010 State Highway 72 W, Cuero", **Ask RidePilot** now looks it up on Azure Maps and the card says **Found on Azure Maps**. Check the pin is on the right building before you click **Add it**. Only the place's name and town are looked up.
- added: "2026-10-05 17:45"
  title: Trips page after deleting a customer
  body: |
    If you had filtered the **Trips** list by a customer and that customer was then deleted, the Trips page stopped opening. It now opens normally and simply drops that customer from the filter.
- added: "2026-10-05 18:05"
  title: Early-morning times are double-checked
  body: |
    When a trip or subscription has a pickup or appointment time between **12:00 AM** and **4:59 AM**, saving now asks "Did you mean PM?" first. Several subscriptions had been saved for 12:00 AM (midnight) or 3:45 AM instead of PM; those have been corrected.
- added: "2026-10-05 18:04"
  title: Removing days from a subscription removes their trips
  body: |
    When you untick a day on a **Subscription Trip** and save, RidePilot now removes the trips it had already made for that day in the coming weeks, and the message at the top of the page lists them. You no longer have to cancel them one by one. Trips that already have a result are kept.

    Changing a subscription's time or addresses still only affects trips it makes from then on, so change any trips already made for the coming weeks one by one.
- added: "2026-10-05 18:03"
  title: Rural runs start at 7:00
  body: |
    Rural demand-response runs (**RVIC**, **RGON**, **DeWitt**, **RCAL**, **MATA**, **JACK** and Goliad's **Rgol** runs) now run **7:00 AM - 4:00 PM**, like Lavaca's, so 7:00 pickups fit without changing the run by hand first. Runs you already changed by hand are left as you set them.

    **UDR** runs stay **8:00 AM - 5:00 PM**. They can be made longer for a day, but never shorter than the fixed-route day.
- added: "2026-10-05 18:02"
  title: Restart notices
  body: |
    When RidePilot has to restart for updates, a bar across the top of the page now counts down to the time, turns red in the last minute, and says when RidePilot is back. Save what you are working on before the countdown ends; when the bar turns green, click **Reload**. Most updates will not need a restart at all.
- added: "2026-10-05 18:01"
  title: Clearer messages when a trip will not go on a run
  body: |
    When **Dispatch** refuses to put a trip on a run, the message now names the run and its day, with the run's hours and the pickup time, for example "No vehicle is assigned (RVIC1, Tue Oct 6)". Check it is the day you meant: tomorrow's runs may not have a vehicle or driver yet.
- added: "2026-10-05 18:00"
  title: Faster Trips, Runs and Dispatch at busy times
  body: |
    The **Trips**, **Runs** and **Dispatch** pages no longer slow to a crawl when everyone is working at once; most should open in a few seconds. The **Trips** list can still take a few seconds on a busy day, and we are working on that next.
- added: "2026-10-04 20:30"
  title: Faster Ask RidePilot answers
  body: |
    **Ask RidePilot** now starts answering in a second or two instead of about 20 seconds, and runs on a newer model that sticks more closely to the RidePilot guide. If an answer is wrong, click **No** under **Was this helpful?** so I.T. can fix it.
- added: "2026-10-03 21:31"
  title: Driver tablet 1.0.31
  apps: [tablet]
  body: |
    **GCRPC Demand Response 1.0.31**: each stop the driver taps now includes where the tablet was, so dispatch has a location for every stop, including on vans with no bus GPS. Runs also stay on the driver's **My Runs** list after 7 PM.
- added: "2026-10-03 19:34"
  title: Evening runs stay on the tablet
  apps: [tablet]
  body: |
    After 7 PM a driver's run could drop off the tablet's **My Runs** list, because the server counted the date from a clock that had already rolled over to tomorrow. Evening runs now stay listed until the day actually ends, and the bus GPS keeps recording for them.
- added: "2026-10-03 19:16"
  title: Tablet stop check
  for: admins
  body: |
    Each morning dispatch's supervisor gets a short email listing runs where the tablet record doesn't line up with the day, for example several stops at different places recorded within a couple of minutes, so someone can check in. It only counts taps the tablet proves it made with a signal, so dead zones, re-syncs and wrong map pins never put a run on it. No-show pickups now also count toward **Pins to check**.
- added: "2026-10-03 17:50"
  title: Pins to check
  body: |
    RidePilot now notes where the van actually stops for each finished pickup and drop-off, from the bus GPS. When drivers have stopped at the same spot on three or more days and it's far from the address's map pin, the address shows on **Pins to check** (link on the **Addresses** page). Look at both points on the map and choose **Use where drivers stop** or **Keep the pin**. Nothing moves until you choose.
- added: "2026-10-02 17:15"
  title: Driver tablet 1.0.30
  apps: [tablet]
  providers: [1]
  body: |
    **GCRPC Demand Response 1.0.30**: Drivers' taps (Depart, Arrive, Pick Up, Drop Off, No Show, fares) are no longer lost in a dead zone. The tablet keeps them, shows "sending…", and sends them with the time they were tapped when the connection is back, so a stop can fill in on your screen a few minutes after the driver did it.

    The run screen shows when it was last updated and has a **Refresh** button, and when you publish a change the driver sees what changed. Buttons on the tablet now have words, not just icons.
- added: "2026-10-02 16:05"
  title: Place a rider's address on the map
  body: |
    When a rider's address isn't on the map, the address box now offers **Place it on the map**. RidePilot looks up the house on our own map, then with the US Census address lookup, and if neither knows the house it puts the pin on the street. The message tells you which; when it says "on the street", check the pin and move it to the house.
- added: "2026-10-02 15:23"
  title: Added trips reach the tablet
  body: |
    Trips you add to a run now reach the driver's tablet when you **Publish**, even when the driver has already finished stops scheduled later in the day. Before, those trips were left off the tablet and had to be re-timed after the last finished stop.
- added: "2026-10-02 15:01"
  title: Dispatch by area
  providers: [1]
  body: |
    On **Dispatch**, unassigned trips now show the **Area** the rider lives in (UDR, RVIC, RCAL, JACK, RGON, DeWitt, MATA), with Bloomington riders marked RVIC1 and Yorktown riders DeWitt1. Use the buttons above the list to show one area, or click the **Area** heading to sort by area. For a home right on the Victoria city line, set **Area (for Dispatch)** on the rider.
- added: "2026-10-02 14:22"
  title: Where an address belongs
  body: |
    A rider's home goes on the rider's record (**Addresses** panel on the rider), not in the shared saved places, where every CSR would see it. RidePilot now asks "This looks like someone's home" when a new saved place is called Home or named after a rider, and says "Not on the map yet" when a rider's address has no pin, with how to fix it. The **Addresses** page links a two-page guide.
- added: "2026-10-02 12:51"
  title: Typed-in addresses land on the map
  body: |
    When you save a place with an address the suggestions don't know (a rural house number, for example), RidePilot now looks it up with the US Census and, if it finds that exact address, puts it on the map so it comes up when booking. The message says so; check the pin. Places named like a home, or by their street address alone, are left for you or GCRPC I.T.
- added: "2026-10-02 12:35"
  title: GCRPC Fixed Route 1.19 on the tablets
  apps: [fixed]
  providers: [1]
  body: |
    Fixed Route has a new gold bus icon. The first screen shows who is signed in, with **Sign out** next to it, and the version at the bottom reads like **v1.19**. A **Finish setting up this tablet** card at the top of the route list walks through GPS, WireGuard and updates once, and the app turns WireGuard back on by itself or says plainly when the tablet is offline.
- added: "2026-10-02 12:35"
  title: GCRPC Demand Response 1.0.29 on the tablets
  apps: [tablet]
  body: |
    Demand Response has a new navy bus icon. A **Finish setting up this tablet** card on the sign-in screen walks through GPS, WireGuard and updates once. The app turns WireGuard back on by itself, and says plainly when the tablet has no internet or can't reach RidePilot (taps are kept and sent when it's back). Tablets update from the **Update** bar; GCRPC I.T. can also ask a tablet to update from **Vehicles > Tablets**.
- added: "2026-10-02 11:00"
  title: Move a bus to disposition
  body: |
    On a bus's page, **Move to disposition** takes it out of service for good: dispatch can't put it on a run, and it stays on **Vehicles** with a gold **Disposition** badge. When it has left the fleet, **Record disposal** keeps how (sold, auctioned, transferred…), the date, final odometer and proceeds. **Back in service** undoes it. **Reports > Vehicle Disposition** lists buses in disposition and the ones disposed of in a date range, with method, final odometer and proceeds, as Excel or PDF.
- added: "2026-10-02 09:45"
  title: Tablets page for GCRPC I.T.
  for: admins
  providers: [1]
  body: |
    **Vehicles > Tablets** lists every driver tablet as its apps report it (Demand Response 1.0.24+, Fixed Route 1.16+). The current release of each app is at the top; each row shows the tablet's versions, old apps, WireGuard setup, battery, network and who used it. **Ask to update** puts an Update bar on a tablet that's behind. Open a tablet for details, a short technician's read, and notes.
- added: "2026-10-01 21:05"
  title: "Driver tablet 1.0.22: a welcome on the sign-in screen"
  apps: [tablet]
  body: |
    Under the sign-in form, drivers now see how many neighbors the whole team got where they needed to go the day before (and that week), today's weather for Victoria with any National Weather Service warning for our counties, and a line for the day. Team totals only, never anyone's name or personal numbers.

- added: "2026-10-01 20:35"
  title: "Fixed Route tablet 1.15: one button per line"
  apps: [fixed]
  providers: [1]
  body: |
    The fixed-route tablet's first screen now has one button per line: **Blue (one bus)**, **Red (one bus)** and so on, plus **Gold + Green (one bus)**. Each opens that bus's whole day in order. The single directions are still there under **Single directions** at the bottom, and only the button that matches the driver's run in RidePilot says **Scheduled**.

    Gold + Green combined is now hourly: Gold leaves HEB on the hour, Green at :29.

- added: "2026-10-01 20:20"
  title: "Garages: move a bus between yards from a list"
  body: |
    **Vehicles > Garages** lists the yards each agency's buses live at; add one with **Add a garage** (a name, and the address picked from the list so it's on the map). On a bus's page, the **Garage** list moves it: its upcoming runs that use its garage now start and end at the new one, and a run already on a driver's tablet today is updated there too.

    For one run, **Change Locations** on the run's page now has **Starts at** and **Ends at** lists of the same garages.

- added: "2026-10-01 17:20"
  title: "Revoke a run's cancellation"
  body: |
    On **Runs**, tick the runs and choose **Apply Action to Selected Runs > Revoke cancellation** to undo a cancellation. The run loses its **Cancelled** label, and recurring trips for that day go back on it; trips booked one at a time have to be put back from **Dispatch**. Publish each run's manifest again afterwards.

- added: "2026-10-01 14:00"
  title: "Driver tablet 1.0.21: messages from dispatch"
  apps: [tablet]
  body: |
    On version 1.0.21, a message you send a driver pops up over whatever screen they're on, with a sound and a vibration, and buttons to **OK**, **Reply** or (for a will-call) **Go to stop**. The chat icon shows how many they haven't read, the chat screen has big one-tap replies, and the screen stays on while the app is open.

- added: "2026-10-01 13:58"
  title: "Will call ready, and no-shows from drivers"
  body: |
    When a will-call rider phones to say they're ready, press **Ready** next to **Will call** on their pickup in **Dispatch**. The driver's tablet shows the rider's name, address and phone with a **Go to stop** button, and Dispatch shows the time you sent it.

    When a driver marks a rider **No Show** on the tablet, you get a driver-message pop-up saying so. In a driver's chat window, **Seen by the driver** shows when they've read your messages.

- added: "2026-10-01 13:43"
  title: "Reports: the 31st of a short month"
  for: admins
  body: |
    Choosing a day a month doesn't have, such as **September 31**, on a report's dates gave an error page. It now runs to the last day of that month.

- added: "2026-10-01 13:38"
  title: "Driver messages reach you on every page"
  body: |
    When a driver sends a message, a pop-up appears in the bottom-left corner with a chime, on any RidePilot page, not just CAD/AVL. Press **Reply** to answer. The chat-bubbles icon at the top shows how many driver messages nobody has seen yet; click it for today's list. Once anyone opens or answers a driver's chat, it shows **Seen by** their name for everyone.

    Emergency alerts now stay across the top of every page with an alarm until someone presses **Got it!**. Turn the chime off, or turn on desktop alerts, from the chat-bubbles list.

- added: "2026-10-01 12:30"
  title: "Driver tablet 1.0.20: version at the bottom of the screen"
  apps: [tablet]
  body: |
    The driver tablet now shows its version and build date in small grey type at the bottom of every screen (for example **v1.0.20 · built 10-01 12:24**), so you can tell at a glance whether a tablet has the latest update. It also tells RidePilot which version each tablet is running.

- added: "2026-10-01 12:15"
  title: "Reports download as Excel"
  body: |
    Reports with a **CSV** download can now also be downloaded as **Excel**: choose **Excel** in the report's format list before you press **Run**. It carries the GCRPC heading and colours, prints landscape on one page width, and amounts come through as numbers, so Excel can total them.

- added: "2026-10-01 12:00"
  title: "New report: Fares Collected"
  body: |
    **Reports > Fares Collected** lists every fare drivers recorded on the tablet, with cash and fare card totals by driver, run or day, and each fare with its rider and run. Use it to match a driver's cash to what the tablet recorded; choose CSV to download it. If you work for more than one agency, choose **All my agencies** to see each agency's fares and totals in one report.

- added: "2026-10-01 11:30"
  title: "Address search finds spelled-out street numbers"
  body: |
    Typing a numbered street in words, such as **202 E Second St Bloomington**, now finds the address the map knows as 2nd Street. Before, it found nothing and the trip had to be booked by latitude and longitude, which drivers see only as coordinates.

- added: "2026-10-01 10:30"
  title: "Export trips in range works again"
  for: admins
  body: |
    **Reports > Export trips in range** gave an error instead of a download. It now downloads the CSV, and it holds only your own agency's trips.

- added: "2026-10-01 09:30"
  title: "See a driver's tablet without disturbing them"
  apps: [tablet]
  body: |
    To see what a driver sees, sign in on any Demand Response tablet as your username, a slash, and the driver's username (for example **andrewv/jamesc**) with your own password. It shows their runs and stops with **(view only)** after the name.

    Nothing can be changed from a view-only tablet, and signing out of it does not sign the driver out.

- added: "2026-10-01 09:00"
  title: "Drivers can complete stops on the tablet"
  apps: [tablet]
  body: |
    Until 9:00 this morning, drivers saw only **Undo** on a stop and could not mark it started or done, so stops stayed **Pending**. That is fixed: drivers open the stop and tap **Depart**, **Arrive**, then **Pick Up** or **Drop Off**.

    Stops finished on the road before 9:00 were not recorded. Fill those in from the run, or have the driver tap through them.

- added: "2026-10-01 08:51"
  title: "Driver tablets get live updates again"
  apps: [web, tablet]
  body: |
    Driver tablets were not receiving live updates from RidePilot, including **emergency alerts**. They now do: an alert reaches the tablet within seconds, and a tablet reloads its manifest when you press **Publish**. RidePilot should also feel faster, since the tablets are no longer reconnecting all day.

- added: "2026-10-01 08:51"
  title: "Cancelled trips leave the driver's tablet right away"
  apps: [web, tablet]
  body: |
    When you cancel, turn down or delete a trip, it now comes off the driver's tablet within seconds. You no longer need to press **Publish** for that.

    Other changes, such as moving a trip or changing its time, still reach the tablet only when you press **Publish**. No-shows stay on the tablet, since the driver recorded them there.

- added: "2026-10-01 08:40"
  title: "CAD/AVL keeps following a run after a trip is removed"
  body: |
    On **CAD/AVL**, a run whose trip was removed after its manifest was published could stop updating on the map. It now keeps following the bus and skips the removed stop.

- added: "2026-10-01 08:10"
  title: "Driver tablet 1.0.19: pick-up and drop-off times"
  body: |
    The manifest now shows each stop's time: the pick-up time, the
    appointment time for drop-offs ("by 8:30 AM"), and when the bus is
    expected, in red if it's running late. The stop screen says "Pick up at
    8:00 AM" under the rider's name. Tap Update on the tablet, then Install.
  apps: [tablet]

- added: "2026-09-30 17:00"
  title: "A customer's trips, and a card when you hover their name"
  body: |
    The customer's page has a new **Trips** panel: their next 10 and last 10
    trips side by side, with whether each is on a run. And rest the pointer
    on any customer's name (Customers, Trips, Dispatch) for a quick card:
    phone, home, mobility, fare category, alerts, and their next and last trip.

    The red alert at the top of a customer's record now shows only real
    alerts: the "Imported from legacy system" notes moved to **Private Notes**.

- added: "2026-09-30 17:00"
  title: "Next Bus: landmarks by each stop"
  body: |
    Each stop in **Next Bus** now lists places riders recognise nearby
    ("By Wendy's · Pizza Hut"); hover a stop to see them on the map, and the
    sentence to read out says "by the Whataburger" when it's right there.
    Search by landmark too ("the Whataburger on Navarro"). Riders know a
    place that isn't listed? Click **+ landmark** to add it for everyone.
  providers: [1]

- added: "2026-09-30 15:45"
  title: "Lavaca: book up to 92 days ahead"
  body: |
    Trips can now be booked up to 92 days ahead (through December 31 from
    today), instead of 21. Subscriptions and recurring runs fill in that far
    ahead too, starting tonight.
  providers: [143]

- added: "2026-09-30 14:25"
  title: "5310 funding ended: Rider Fares / Donations is the default"
  body: |
    FTA Section 5310 is no longer available to Victoria Transit, so it is gone
    from the **Funding Source** lists. Customers who defaulted to it now
    default to **Rider Fares / Donations**, and so do their subscriptions and
    trips from October 1 on. Trips before October 1 keep 5310.
  providers: [1]

- added: "2026-09-30 13:52"
  title: "Driver tablet 1.0.18: the emergency button tells the driver what happened"
  body: |
    After pressing the emergency button, the driver sees a red banner until
    someone at dispatch clicks **Got it!**, then a green one naming who
    received it. If nobody answers within a minute, or the alert can't be
    sent, the banner tells the driver to call dispatch.
  apps: [tablet]

- added: "2026-09-30 13:34"
  title: "Next Bus: when a fixed-route rider calls"
  body: |
    New **Next Bus** tab (before CAD/AVL). Type where the caller is
    ("Mockingbird and Navarro", "the mall") and press Enter: read out the
    sentence in the gold box, with the next buses for the stops nearby below
    it. **Live** means the bus is reporting and includes how late it's
    running; **Timetable** is the published time. **New call** clears it.
  providers: [1]

- added: "2026-09-30 13:34"
  title: "Driver emergency alerts now reach the office"
  body: |
    When a driver presses the emergency button on the tablet, a red
    **Emergency Alert** now pops up on every RidePilot screen open for that
    agency (this wasn't getting through before). Click **Got it!** once you're
    handling it; it closes on everyone else's screen. Stay on your own
    agency in RidePilot to see your drivers' alerts.

- added: "2026-09-30 12:10"
  title: "Lavaca: Title III and New Horizons rides have no fare"
  body: |
    Two new funding sources, **Title III** and **New Horizons**: the ride is
    paid by them and the rider pays nothing. Choose the right one as the
    trip's **Funding Source**, or make it the customer's default. The fare
    panel then says **No fare**, Dispatch and the manifest say **no fare**,
    and the driver's tablet shows no fare box and a "NO FARE" note on the
    pickup.
  providers: [143]
  apps: [web, tablet]

- added: "2026-09-30 12:10"
  title: "Ask RidePilot: find a place, or paste one from Google Maps"
  body: |
    Ask **Ask RidePilot** to find a place ("where is the Walmart on Navarro?")
    and it shows it on a map. When our map doesn't know an address, use the
    **Find** box on the card: search for something nearby, or paste a spot
    copied from Google Maps (right-click the building, click the numbers).

- added: "2026-09-30 11:09"
  title: "Ask RidePilot: make it bigger"
  body: |
    Click **Bigger** at the top of the **Ask RidePilot** panel for a large
    panel with a large map, handy for dropping a pin on a building;
    **Smaller** puts it back. Or drag the panel's top-left corner to any size
    you like. RidePilot remembers the size.

- added: "2026-09-30 10:50"
  title: "Fixed-route tablet 1.13: the keyboard fits"
  body: |
    On the **GCRPC Fixed Route** tablet, the keyboard no longer covers the
    screen with a white band when signing in: the sign-in box moves up and
    **Username**, **Password** and **Sign in** stay above the keyboard. Tap
    **Update** on the bar at the top of the app, then **Install**.
  providers: [1]
  apps: [fixed]

- added: "2026-09-30 10:22"
  title: "Fixed-route tablet: driver sign-in works"
  body: |
    Drivers can now sign in on the **GCRPC Fixed Route** tablet with their
    usual tablet login (the same one as the Demand Response app). Before
    this it always said **Sign-in failed (200)**. Nothing to update on the
    tablet.
  providers: [1]
  apps: [fixed]

- added: "2026-09-30 10:21"
  title: "Ask RidePilot can add a saved place"
  body: |
    Ask **Ask RidePilot** to add a place the way you'd ask a co-worker:
    "add 311 Spring Green Blvd, Victoria 77904, it's the VA Clinic". It shows
    a card with the name, address, category and a map; check it, drag the pin
    onto the building if needed, and click **Add it**. It warns you if the
    place is already saved. Nothing is saved until you click.

- added: "2026-09-30 09:47"
  title: "Address search: highways, and add the town"
  body: |
    Typing a highway address such as **1219 West State Highway 72, Cuero**
    now finds the Cuero stretch of the road, not just a town far away with
    the same street name. The map knows highways as "TX 72" or "FM 953";
    RidePilot tries that spelling for you. Add the town after a comma and
    suggestions near that town come first.

- added: "2026-09-30 09:46"
  title: "Dispatch: demand-response runs first, in order"
  body: |
    **Dispatch** now shows demand-response runs only, in the order you'd
    expect (UDR1, UDR2 ... UDR10), and the "move trips to" menu lists only
    runs that can take a trip. To see fixed-route runs, or everything,
    use the new choice next to the date; RidePilot remembers it for you.
    The **Runs** page sorts the same way.

- added: "2026-09-30 07:07"
  title: A new driver manifest printout
  body: |
    **Print manifest** has a new one-page layout: one line per stop with the
    rider's phone, wheelchair or walker, will call, guests, the fare to
    collect, the address and its notes, and blanks for arrived and departed
    times. The header shows the driver, bus, hours and a count of trips,
    riders and wheelchairs. A run with 13 trips prints on 2 pages instead
    of 7.

- added: "2026-09-29 17:07"
  title: Print manifest works before a run is published
  body: |
    The **Print manifest** button on a run now prints its stops even before
    the manifest is published to the driver, marked "DRAFT: not yet
    published to the driver." Before, it printed an empty page.

- added: "2026-09-29 16:39"
  title: Typed addresses work on subscription trips
  body: |
    On a subscription trip you can now type an address instead of picking it
    from the suggestions, just like on a regular trip: RidePilot matches the
    rider's saved addresses and common addresses, or finds it on the map. If
    it can't find the place, it now says so ("couldn't be located...")
    instead of "can't be blank."

- added: "2026-09-29 16:14"
  title: "Driver tablet 1.0.17: will-call badge"
  apps: [tablet]
  body: |
    The driver tablet app (GCRPC Demand Response) has an update. Will-call
    pickups now show an amber **Will call** badge on the driver's list of
    stops, and a banner on the stop itself. Drivers see an update banner
    when they open the app: tap **Update**, then **Install**.

- added: "2026-09-29 15:58"
  title: Will-call trips
  apps: [web, tablet]
  body: |
    Tick **Will call** on a trip (or subscription trip) when the rider will
    call when they're ready, usually for the ride home. The pickup time you
    enter is treated as an estimate. The trip shows a **Will call** label on
    the Trips list and in Dispatch, and the driver's tablet shows "WILL CALL"
    at the top of that pickup's notes. When the rider calls, set the real
    pickup time and untick **Will call**.

- added: "2026-09-29 15:03"
  title: A mobility icon next to riders who need one
  body: |
    On **Dispatch** (the trips list and each run's manifest) and on the
    **Trips** page, a rider whose trip lists a wheelchair or scooter now has
    a wheelchair icon before their name; a walker or other aid shows a person
    with a cane. Point at the icon to see the exact device. It comes from the
    trip's mobility section, so keep that filled in.

- added: "2026-09-29 14:56"
  title: Duplicate check for subscription trips
  body: |
    Saving a subscription trip now checks whether the rider already has one
    on the same days with the same pickup and drop-off, or a pickup within
    an hour. If so, RidePilot shows it and asks: **Back** to check, or
    **Save anyway** if it's a different ride. A matching ride home doesn't
    count.

- added: "2026-09-29 14:48"
  title: Duplicate trip warning works again
  body: |
    When you book a trip for a rider who already has a trip that day,
    RidePilot shows **Warning: Potential Duplication of Trips** with their
    other trips, so you can go **Back** instead of booking it twice. It had
    stopped appearing for new trips; it works again.

- added: "2026-09-29 14:12"
  title: "Trip dates: today by default, and a check for past dates"
  body: |
    The **New Trip** form now starts on today's date, and its calendar shows
    the first days of next month, so late in the month you can click the 1st
    of next month right in this month's calendar.

    If you save a trip dated before today, RidePilot asks whether you meant a
    later date. Click **Cancel** to fix it, or **Save anyway** if the past
    date is right.

- added: "2026-09-29 13:34"
  title: Addresses that aren't on the map
  body: |
    Some saved addresses have no map location, and those never come up when
    booking a trip, which is why some got saved more than once. The
    **Addresses** page now marks them **Not on map**, and saving one shows a
    warning. Ask GCRPC I.T. to place any you need. Searching by street and
    city ("600 hospital circle, bay city") works now too.

- added: "2026-09-29 13:11"
  title: Helping I.T. find the rough spots
  body: |
    RidePilot now lets GCRPC I.T. know when a page breaks, loads slowly, or
    turns down a save, so they can fix the rough spots. It records only the
    screen, the agency, the time and the message shown, never who it
    happened to or what was typed, and it keeps them for 90 days.

- added: "2026-09-29 12:15"
  title: What's new in RidePilot
  body: |
    Changes to RidePilot are now listed on a What's new page, newest first.
    The megaphone at the top right of every page opens it, and a red number
    on it shows how many notes you haven't read yet.

- added: "2026-09-29 12:11"
  title: A quote for the day, and today's rides
  body: |
    The bar at the bottom of every page shows a quote for the day. Once
    drivers mark drop-offs done on their tablets, it will also show how many
    rides your office has completed today.

- added: "2026-09-29 11:56"
  title: Ask RidePilot, the help button
  body: |
    Click **Ask RidePilot** at the bottom right of any page and ask how to do
    something, in English or Spanish. It answers from GCRPC's RidePilot
    guide. It can't see or change your data, and it can be wrong, so check
    anything important with Kristie or GCRPC I.T.

    Drag the button or the panel out of the way and it stays there. The
    conversation follows you from page to page; **New chat** starts over.
    The thumbs up or down under an answer tell us whether it helped.

- added: "2026-09-29 11:41"
  title: The Dispatch divider stays where you put it
  body: |
    On **Dispatch**, drag the bar between the runs and the Trips list to the
    height you like, and RidePilot remembers it on that computer. Neither
    side can be dragged out of sight, and the Trips list now opens by
    default.

- added: "2026-09-29 10:49"
  title: Optimize Route plans a workable route
  body: |
    **Optimize Route** on a demand-response run now keeps each pickup
    between 5 minutes before and 10 minutes after the booked time, gets
    riders to appointments on time, keeps time on board reasonable, allows
    time to board at each stop, and keeps the bus inside the run's hours.

    If any trip can't fit, it changes nothing and names the trip to move to
    another run. It won't change a run that has started. A progress bar
    shows while it works, about 15 seconds.

- added: "2026-09-29 08:41"
  title: Gold+Green is its own run
  providers: [1]
  body: |
    Days when one bus runs Gold then Green now show as one **Gold+Green**
    run, like the commuter doubles. Boardings still count toward Gold and
    Green.

- added: "2026-09-28 17:00"
  title: Password reset emails work
  body: |
    **Forgot your password?** on the sign-in page now sends a reset email.
    Before, RidePilot couldn't send email at all.

- added: "2026-09-28 15:37"
  title: FY27 fares everywhere
  body: |
    Demand-response fares now follow GCRPC's FY27 fare structure in every
    area, Goliad and Lavaca included: by distance (0-5, 6-10, 11-15, 16-20
    and 21+ miles) for Youth, Adult and Elderly/Disabled riders, and children
    under 5 ride free.

    A companion pays the same fare as the rider; a personal care attendant
    rides free. Gonzales County rides are free through September 30 and pay
    the fare from October 1.

- added: "2026-09-28 15:13"
  title: The fare to quote a cash rider
  apps: [web, tablet]
  body: |
    The trip form and trip page show **Fare to quote**: what to tell a rider
    paying cash, from the trip's distance and the rider's fare category. The
    Trips list on **Dispatch** has a Fare column; an * means the rider has no
    fare category, so Adult was assumed. Set it with **Fare category** on the
    customer form.

    Drivers' tablets show the fare box at pickup, filled in with the same
    fare, including trips made by the nightly recurring-trip run.

- added: "2026-09-28 15:12"
  title: Dispatch run panel fixed
  body: |
    The run panel on **Dispatch** opens again for demand-response runs. It
    was showing an error for today's and future runs.

- added: "2026-09-26 19:26"
  title: The Addresses page opens fast
  for: admins
  body: |
    The provider's common **Addresses** page now opens in about 2 seconds
    instead of more than 30.

- added: "2026-09-25 15:28"
  title: Fix a street or add a unit number
  body: |
    You can now correct the street on a common address when editing it, and
    add an apartment or unit number to a customer's saved address after
    picking it from the address search.

- added: "2026-09-22 14:58"
  title: Find runs with no driver or no bus
  body: |
    On **Runs**, the driver and bus filters have **No driver assigned** and
    **No bus assigned**, to find the runs that still need one.

- added: "2026-09-22 14:34"
  title: Fixed Route Compliance report
  providers: [1]
  body: |
    **Reports** has a new **Fixed Route Compliance** report: one row per
    fixed-route run with miles, riders and fares, skipped stops, early
    departures and late arrivals, and whether the pre- and post-trip
    inspections were filed. Filter by dates, route, driver or bus, and
    export to CSV.

- added: "2026-09-11 08:36"
  title: Create a driver's tablet login in one step
  for: admins
  body: |
    The **New Driver** page can create the driver's tablet login: tick
    **Create a login for this driver**. The password is shown once, to copy
    and give to the driver. The driver's page has **Reset tablet password**
    for when they forget it.
