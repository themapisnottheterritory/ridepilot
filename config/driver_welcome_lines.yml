# The driver tablet's sign-in screen shows one of these a day (DriverWelcome),
# the same on every tablet, in this order. Written for drivers: warm, plain,
# not corporate. Edit freely; the next tablet to open the screen picks it up.
- Our community works better because you showed up today.
- Some rides matter more than they look. A five-mile trip can mean a paycheck, a medical appointment, independence, or just getting home.
- Somebody's whole day starts when you pull up.
- You're the friendly face a lot of people see first thing in the morning.
- Getting a neighbor home safe is a good day's work.
- A wave, a hand with the bags, a little patience: people remember that.
- Thank you for being out there. Drive safe, take your breaks.
- You showed up. People depended on you. It mattered.
