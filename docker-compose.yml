version: '3'
volumes:
  postgres_data:
  redis:
  # Persist the gem bundle so runtime `bundle install`s (gems added to the
  # Gemfile after the image was built) survive container recreation.
  bundle_cache:
services:
  db:
    image: mdillon/postgis:9.4
    restart: unless-stopped
    volumes:      
      - postgres_data:/var/lib/postgresql/data 
    ports: 
      - 127.0.0.1:5432:5432   # local only (was open to the LAN with no password); admins: ssh -N -L 5432:localhost:5432 philz@10.0.0.16

  redis:
    image: 'redis:7-alpine'
    restart: unless-stopped
    volumes:
      - redis:/data

  app:
    build:
      context: ..
      dockerfile: ./ridepilot/docker/app/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
      - redis
    env_file:
      - ./docker/.env
    environment:
      PSYCH_ENABLE_ALIASES: "true"  # Enables YAML alias parsing
      OPTIMIZER_URL: "http://optimizer:8765"
    ports:
      - 3000:3000
    volumes:
      - .:/var/www/ridepilot
      - ../engines:/var/www/engines
      - bundle_cache:/usr/local/bundle

  web:
    build:
      context: ..
      dockerfile: ./ridepilot/docker/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - 80:80
      - 443:443
    volumes:
      # nginx vhosts (RAILS_ROOT hardcoded in the file). The FOLDER is
      # mounted, not the file: git replaces nginx.conf with a new file on
      # every change, and a single-file mount keeps showing the container the
      # old one until it is recreated (the restart banner's nginx block was
      # never live from 2026-10-05 to 10-07). nginx loads conf.d/*.conf, so
      # only nginx.conf counts here; the Dockerfile beside it is ignored.
      # ops/restart/ridepilot-restart.sh checks what nginx sees and reloads it.
      - ./docker/web:/etc/nginx/conf.d:ro
      # TLS leaf for rp.internal.gcrpc.org (GCRPC Internal Root CA); kept
      # outside the repo.
      - /home/philz/ridepilot-ops/certs:/etc/nginx/certs:ro

  sidekiq:
    restart: unless-stopped
    depends_on:
      - db
      - redis
    build:
      context: ..
      dockerfile: ./ridepilot/docker/app/Dockerfile
    env_file:
      - ./docker/.env
    environment:
      OPTIMIZER_URL: "http://optimizer:8765"
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - .:/var/www/ridepilot
      - ../engines:/var/www/engines
      - bundle_cache:/usr/local/bundle

  optimizer:
    build: ./optimizer_service
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      OSRM_URL: "http://osrm:5000"
    depends_on:
      - osrm

  osrm:
    image: osrm/osrm-backend
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/texas-latest.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - "5000:5000"
  