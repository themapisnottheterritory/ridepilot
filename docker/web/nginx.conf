# NOTE: mounted directly as /etc/nginx/conf.d/default.conf (see docker-compose
# web volume), so RAILS_ROOT is hardcoded rather than envsubst'd at build time.
upstream rails_app {
   server app:3000;
}

# Allow DVIR inspection photo uploads (camera images are several MB; nginx
# default client_max_body_size is only 1m -> 413).
client_max_body_size 25m;

# Self-hosted OSM raster tiles (overv/openstreetmap-tile-server, Texas import).
# Replaces the public tile.openstreetmap.org dependency; reachable on :80/:443
# so tablets get tiles in-tunnel too.
upstream osm_tiles {
   server osm-tiles:80;
}

# OSRM routing backend — proxied on :80/:443 so browser/tablet clients reach it
# in-tunnel (the app calls http://<host>/osrm/...); direct :5000 is firewalled.
upstream osrm_backend {
   server osrm:5000;
}

# ---------------------------------------------------------------------------
# Default / fallback vhost (unchanged): answers any other Host on :80,
# including direct-IP and localhost access (e.g. the dev SSH tunnel).
# ---------------------------------------------------------------------------
server {
   server_name www.example.com;
   root   /var/www/ridepilot/public;
   index  index.html;
   access_log /var/www/ridepilot/log/nginx.access.log;
   error_log /var/www/ridepilot/log/nginx.error.log;

   location ~ /\. { deny all; }
   location ~* ^.+\.(rb|log)$ { deny all; }

   location ~ ^/(assets|images|javascripts|stylesheets|swfs|system)/ {
      try_files $uri @rails;
      access_log off;
      gzip_static on;
      expires max;
      add_header Cache-Control public;
      add_header Last-Modified "";
      add_header ETag "";
      break;
   }
   location /tiles/ {
      proxy_pass http://osm_tiles/tile/;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public";
      add_header Access-Control-Allow-Origin *;
   }
   location /osrm/ {
      proxy_pass http://osrm_backend/;
      proxy_set_header Host $host;
      add_header Access-Control-Allow-Origin *;
   }
   # ActionCable websocket — needs the HTTP/1.1 Upgrade dance or it 404s.
   location /cable {
      proxy_pass http://rails_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
   }
   location / { try_files $uri @rails; }
   location @rails {
      proxy_set_header  X-Real-IP  $remote_addr;
      proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header  Host $http_host;
      proxy_redirect off;
      proxy_pass http://rails_app;
   }
}

# ---------------------------------------------------------------------------
# rp.internal.gcrpc.org — GCRPC internal-auth standard.
#   nginx terminates TLS with a leaf signed by the GCRPC Internal Root CA
#   (workstations already trust the root -> no warning) and proxies to the
#   app, marking the request https so OmniAuth builds https redirect URIs
#   for Entra SSO. Mirrors ~/ptt-scribe/deploy/ptt.nginx on 10.0.0.23.
#   Cert files are mounted at /etc/nginx/certs (see docker-compose web volume).
# ---------------------------------------------------------------------------
server {
   listen 80;
   server_name rp.internal.gcrpc.org;
   return 301 https://$host$request_uri;
}

server {
   listen 443 ssl;
   server_name rp.internal.gcrpc.org;

   ssl_certificate     /etc/nginx/certs/rp-fullchain.crt;
   ssl_certificate_key /etc/nginx/certs/rp.key;
   ssl_protocols       TLSv1.2 TLSv1.3;

   root   /var/www/ridepilot/public;
   index  index.html;
   access_log /var/www/ridepilot/log/nginx.access.log;
   error_log /var/www/ridepilot/log/nginx.error.log;

   location ~ /\. { deny all; }
   location ~* ^.+\.(rb|log)$ { deny all; }

   location ~ ^/(assets|images|javascripts|stylesheets|swfs|system)/ {
      try_files $uri @rails;
      access_log off;
      gzip_static on;
      expires max;
      add_header Cache-Control public;
      add_header Last-Modified "";
      add_header ETag "";
      break;
   }
   location /tiles/ {
      proxy_pass http://osm_tiles/tile/;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public";
      add_header Access-Control-Allow-Origin *;
   }
   location /osrm/ {
      proxy_pass http://osrm_backend/;
      proxy_set_header Host $host;
      add_header Access-Control-Allow-Origin *;
   }
   # ActionCable websocket — needs the HTTP/1.1 Upgrade dance or it 404s.
   location /cable {
      proxy_pass http://rails_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
   }
   location / { try_files $uri @rails; }
   location @rails {
      proxy_set_header  X-Real-IP  $remote_addr;
      proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header  Host $http_host;
      proxy_set_header  X-Forwarded-Proto https;
      proxy_set_header  X-Forwarded-Ssl on;
      proxy_redirect off;
      proxy_pass http://rails_app;
   }
}
