# NOTE: mounted directly as /etc/nginx/conf.d/default.conf (see docker-compose
# web volume), so RAILS_ROOT is hardcoded rather than envsubst'd at build time.
upstream rails_app {
   server app:3000;
}

# Allow DVIR inspection photo uploads (camera images are several MB; nginx
# default client_max_body_size is only 1m -> 413).
client_max_body_size 25m;

# Self-hosted OSM raster tiles (overv/openstreetmap-tile-server, Texas import).
# Replaces the public tile.openstreetmap.org dependency; reachable on :80/:443
# so tablets get tiles in-tunnel too.
upstream osm_tiles {
   server osm-tiles:80;
}

# OSRM routing backend — proxied on :80/:443 so browser/tablet clients reach it
# in-tunnel (the app calls http://<host>/osrm/...); direct :5000 is firewalled.
upstream osrm_backend {
   server osrm:5000;
}

# ---------------------------------------------------------------------------
# Default / fallback vhost (unchanged): answers any other Host on :80,
# including direct-IP and localhost access (e.g. the dev SSH tunnel).
# ---------------------------------------------------------------------------
server {
   server_name www.example.com;
   root   /var/www/ridepilot/public;
   index  index.html;
   access_log /var/www/ridepilot/log/nginx.access.log;
   error_log /var/www/ridepilot/log/nginx.error.log;

   location ~ /\. { deny all; }
   location ~* ^.+\.(rb|log)$ { deny all; }

   # The .apk lives in the app container's public/ (the web image's public/ is
   # baked at build, no repo mount), so proxy to Rails but rewrite the response
   # headers: real package MIME + a fixed .apk filename so Chrome doesn't sniff
   # the ZIP magic bytes and re-save it as .zip (which breaks tap-to-install when
   # staging tablets). nosniff stops the content-type override.
   location ~* \.apk$ {
      proxy_pass http://rails_app;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_hide_header Content-Type;
      add_header Content-Type application/vnd.android.package-archive;
      add_header Content-Disposition 'attachment; filename="rideavl-pilot.apk"';
      add_header X-Content-Type-Options nosniff;
   }

   location ~ ^/(assets|images|javascripts|stylesheets|swfs|system)/ {
      try_files $uri @rails;
      access_log off;
      gzip_static on;
      expires max;
      add_header Cache-Control public;
      add_header Last-Modified "";
      add_header ETag "";
      break;
   }
   location /tiles/ {
      proxy_pass http://osm_tiles/tile/;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public";
      add_header Access-Control-Allow-Origin *;
   }
   location /osrm/ {
      proxy_pass http://osrm_backend/;
      proxy_set_header Host $host;
      add_header Access-Control-Allow-Origin *;
   }
   # ActionCable websocket — needs the HTTP/1.1 Upgrade dance or it 404s.
   location /cable {
      proxy_pass http://rails_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
   }
   location / { try_files $uri @rails; }
   location @rails {
      proxy_set_header  X-Real-IP  $remote_addr;
      proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header  Host $http_host;
      proxy_redirect off;
      proxy_pass http://rails_app;
   }
}

# ---------------------------------------------------------------------------
# rp.internal.gcrpc.org — GCRPC internal-auth standard.
#   nginx terminates TLS with a leaf signed by the GCRPC Internal Root CA
#   (workstations already trust the root -> no warning) and proxies to the
#   app, marking the request https so OmniAuth builds https redirect URIs
#   for Entra SSO. Mirrors ~/ptt-scribe/deploy/ptt.nginx on 10.0.0.23.
#   Cert files are mounted at /etc/nginx/certs (see docker-compose web volume).
# ---------------------------------------------------------------------------
server {
   listen 80;
   server_name rp.internal.gcrpc.org;
   return 301 https://$host$request_uri;
}

server {
   listen 443 ssl;
   server_name rp.internal.gcrpc.org;

   ssl_certificate     /etc/nginx/certs/rp-fullchain.crt;
   ssl_certificate_key /etc/nginx/certs/rp.key;
   ssl_protocols       TLSv1.2 TLSv1.3;

   root   /var/www/ridepilot/public;
   index  index.html;
   access_log /var/www/ridepilot/log/nginx.access.log;
   error_log /var/www/ridepilot/log/nginx.error.log;

   location ~ /\. { deny all; }
   location ~* ^.+\.(rb|log)$ { deny all; }

   # The .apk lives in the app container's public/ (the web image's public/ is
   # baked at build, no repo mount), so proxy to Rails but rewrite the response
   # headers: real package MIME + a fixed .apk filename so Chrome doesn't sniff
   # the ZIP magic bytes and re-save it as .zip (which breaks tap-to-install when
   # staging tablets). nosniff stops the content-type override.
   location ~* \.apk$ {
      proxy_pass http://rails_app;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_hide_header Content-Type;
      add_header Content-Type application/vnd.android.package-archive;
      add_header Content-Disposition 'attachment; filename="rideavl-pilot.apk"';
      add_header X-Content-Type-Options nosniff;
   }

   location ~ ^/(assets|images|javascripts|stylesheets|swfs|system)/ {
      try_files $uri @rails;
      access_log off;
      gzip_static on;
      expires max;
      add_header Cache-Control public;
      add_header Last-Modified "";
      add_header ETag "";
      break;
   }
   location /tiles/ {
      proxy_pass http://osm_tiles/tile/;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public";
      add_header Access-Control-Allow-Origin *;
   }
   location /osrm/ {
      proxy_pass http://osrm_backend/;
      proxy_set_header Host $host;
      add_header Access-Control-Allow-Origin *;
   }
   # ActionCable websocket — needs the HTTP/1.1 Upgrade dance or it 404s.
   location /cable {
      proxy_pass http://rails_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
   }
   location / { try_files $uri @rails; }
   location @rails {
      proxy_set_header  X-Real-IP  $remote_addr;
      proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header  Host $http_host;
      proxy_set_header  X-Forwarded-Proto https;
      proxy_set_header  X-Forwarded-Ssl on;
      proxy_redirect off;
      proxy_pass http://rails_app;
   }
}

# ---------------------------------------------------------------------------
# Fixed-route tooling: route authoring tool (/) + driver tablet app (/driver/).
#
# A separate application on this host, in its own compose stack on :8080. It
# sits behind this nginx because TLS is not optional for it: the driver app
# needs navigator.geolocation and navigator.wakeLock, and browsers refuse both
# outside a secure context. Over plain http the app loads, the pull-out works,
# and no GPS fix ever arrives -- which looks like a broken app rather than a
# misconfigured one.
#
# proxy_pass targets the host IP rather than a container name because the
# fixed-route stack is on its own docker network. Naming it would mean
# attaching this container to that network, which a later `docker-compose up`
# on RidePilot would silently drop.
# ---------------------------------------------------------------------------
upstream fixedroute_api {
   server 10.0.0.16:8080;
}

server {
   listen 80;
   server_name fixedroute.internal.gcrpc.org;
   return 301 https://$host$request_uri;
}

server {
   listen 443 ssl;
   server_name fixedroute.internal.gcrpc.org;

   ssl_certificate     /etc/nginx/certs/fixedroute-fullchain.crt;
   ssl_certificate_key /etc/nginx/certs/fixedroute.key;

   # A long commuter route is ~100 KB of JSON, ~16 KB gzipped -- worth having
   # on tablets metered by the MB.
   gzip on;
   gzip_types application/json application/javascript text/css text/plain;
   gzip_min_length 1024;

   client_max_body_size 8m;

   # Tiles on the SAME ORIGIN. The apps used to point at http://10.0.0.16/tiles,
   # which breaks twice under TLS: mixed content, and a cert-name mismatch,
   # since a request to the bare IP matches no server_name and falls through to
   # the rp.internal.gcrpc.org vhost with its own cert. Same-origin avoids both.
   location /tiles/ {
      proxy_pass http://osm_tiles/tile/;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public";
   }

   # The driver APK is staged into the app's static /driver mount so a tablet
   # can pull it straight off the tunnel. FastAPI's StaticFiles serves it as
   # text/plain -- the slim image's mimetypes table has no .apk -- and Android
   # Chrome then saves a 4 MB .txt that will not install. Override the type and
   # pin the filename here, as the rideavl vhost above already does.
   location ~* \.apk$ {
      proxy_pass http://fixedroute_api;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_hide_header Content-Type;
      add_header Content-Type application/vnd.android.package-archive;
      add_header Content-Disposition 'attachment; filename="gcrpc-driver.apk"';
      add_header X-Content-Type-Options nosniff;
   }

   location / {
      proxy_pass http://fixedroute_api;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;   # Valhalla map-matching a 90-mile shape is slow
      proxy_redirect off;
   }
}
